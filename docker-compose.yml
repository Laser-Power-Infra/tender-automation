version: '3.8'

services:
  automation-worker:
    image: ghcr.io/laser-power-infra/django-worker:${APP_VERSION:-latest}
    # No container_name here (required for --scale to work!)
    command: python manage.py consume_tender_tasks
    restart: unless-stopped
    env_file:
      - .env.production
    networks:
      - infra

  parsing-worker:
    # 🟢 Fixed: Now points to the correct GHCR image
    image: ghcr.io/laser-power-infra/django-worker:${APP_VERSION:-latest}
    # No container_name here (required for --scale to work!)
    command: python manage.py consume_tender_parsing
    environment:
      CONDUTOR_PATH: /mnt/condutor/Tenders-bd/Condutor
      INDEXER_NETWORK_PATH: /mnt/indexer/COSTING & INVOLVEMENT
      SUPPLY_NETWORK_PATH: /mnt/supply
      COSTING_FILE_NETWORK_HOST_PATH: /mnt/costing/COSTING & INVOLVEMENT
      OLD_RA_EXCEL_PATH: /mnt/old-files/TENDER 2023-2024
      OLD_FILES: /mnt/old-files/TENDER 2023-2024
      TYPE_TEST_FILES_PATH: /mnt/condutor/Updated TTR

    volumes:
      - condutor:/mnt/condutor
      - indexer:/mnt/indexer
      - supply:/mnt/supply
      - costing:/mnt/costing
      - old-files:/mnt/old-files
      # Host credentials mounted into the container
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json:rw
    restart: unless-stopped
    env_file:
      - .env.production
    networks:
      - infra

volumes:
  condutor:
    external: true
    name: infrastructure_condutor

  indexer:
    external: true
    name: infrastructure_indexer

  supply:
    external: true
    name: infrastructure_supply

  costing:
    external: true
    name: infrastructure_costing

  old-files:
    external: true
    name: infrastructure_old-files

networks:
  infra:
    external: true