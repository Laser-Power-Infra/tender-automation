name: Build and Deploy tender-executive-automation

on:
  push:
    branches:
      - main  # Change to 'master' if your default branch is master

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
      owner_lowercase: ${{ steps.repo_owner.outputs.owner }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Short Commit SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Convert Repo Owner to Lowercase (GHCR requirement)
        id: repo_owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/django-worker:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/django-worker:${{ steps.vars.outputs.short_sha }}

  deploy:
    name: Deploy to Server
    needs: build-and-push
    runs-on: self-hosted
    steps:
      # Step 1: Checkout repo on the runner
      - name: Checkout Latest Code
        uses: actions/checkout@v4

      # Step 2: Copy the latest docker-compose.yml to the server directory
      - name: Sync Latest docker-compose.yml
        shell: powershell
        run: |
          Copy-Item -Path "docker-compose.yml" -Destination "D:/tender-automation/docker-compose.yml" -Force
          Write-Host "✅ Synced latest docker-compose.yml to D:/tender-automation/"

      # Step 3: Pull new image, scale workers, and smart-clean older builds
      - name: Pull, Scale, and Retain Last 2 Images
        shell: powershell
        working-directory: D:/tender-automation
        env:
          APP_VERSION: ${{ needs.build-and-push.outputs.short_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $env:APP_VERSION = $env:APP_VERSION

          # 1. Pull the shared django-worker image for both services
          docker compose pull automation-worker parsing-worker

          # 2. Scale and restart workers (2 automation workers, 3 parsing workers)
          docker compose up -d --scale automation-worker=2 --scale parsing-worker=3

          # 3. 🟢 Clean old django-worker images (Keeps latest 2 builds, deletes 3rd, 4th, etc.)
          $repo = "ghcr.io/laser-power-infra/django-worker"
          $allImages = docker images --filter "reference=$repo" --format "{{.ID}}" | Select-Object -Unique
          $oldImages = $allImages | Select-Object -Skip 2

          if ($oldImages) {
              Write-Host "Cleaning up old django-worker images: $oldImages"
              $oldImages | ForEach-Object { docker rmi -f $_ }
          } else {
              Write-Host "No old images to prune. Latest 2 preserved."
          }

          # 4. Clean untagged fragments
          docker image prune -f