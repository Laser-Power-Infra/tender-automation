name: Build and Deploy tender-executive-automation

on:
  push:
    branches:
      - main  # Change to 'master' if your default branch is master

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
      owner_lowercase: ${{ steps.repo_owner.outputs.owner }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Short Commit SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Convert Repo Owner to Lowercase (GHCR requirement)
        id: repo_owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/django-worker:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/django-worker:${{ steps.vars.outputs.short_sha }}

  deploy:
    name: Deploy to Server
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Pull and Restart Container
        shell: powershell
        working-directory: D:/tender-automation
        env:
          APP_VERSION: ${{ needs.build-and-push.outputs.short_sha }}
        run: |
          docker compose pull automation-worker parsing-worker
          docker compose up -d --scale automation-worker=2 --scale parsing-worker=3 
          docker image prune -f


        

        