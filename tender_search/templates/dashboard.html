<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Automation Worker Control</title>
<style>
  :root { --green:#22c55e; --red:#ef4444; --gray:#6b7280; --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width: 720px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 22px; margin: 0 0 24px; }
  .card { background:var(--card); border:1px solid #334155; border-radius:12px; padding:20px; margin-bottom:16px; }
  .card h2 { margin:0 0 12px; font-size:17px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .status { display:flex; align-items:center; gap:10px; font-size:14px; }
  .dot { width:12px; height:12px; border-radius:50%; background:var(--gray); }
  .dot.on { background:var(--green); box-shadow:0 0 8px var(--green); }
  .dot.off { background:var(--red); }
  .meta { color:#94a3b8; font-size:13px; margin-top:6px; }
  button { border:none; border-radius:8px; padding:10px 18px; font-size:14px; font-weight:600; cursor:pointer; color:#fff; }
  button.start { background:var(--green); }
  button.stop { background:var(--red); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button.clear { background:#64748b; }
  .err { color:#fca5a5; font-size:13px; margin-top:8px; }
  .filters { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  .filters select, .filters input { background:#0f172a; color:var(--text); border:1px solid #334155; border-radius:6px; padding:8px 10px; font-size:13px; }
  .filters input[type=text] { flex:1; min-width:160px; }
  .logbox { background:#020617; border:1px solid #1e293b; border-radius:8px; height:420px; overflow-y:auto; padding:10px; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size:12px; line-height:1.5; }
  .lrow { white-space:pre-wrap; word-break:break-all; }
  .lrow .ts { color:#64748b; margin-right:8px; }
  .lrow .lv { display:inline-block; width:52px; font-weight:700; margin-right:8px; }
  .lrow .lv.INFO { color:#38bdf8; }
  .lrow .lv.ERROR { color:#f87171; }
  .lrow .lv.WARNING { color:#fbbf24; }
  .lrow .lv.DEBUG { color:#a78bfa; }
  .lrow .w { color:#94a3b8; margin-right:8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Automation Worker Control</h1>

  <div class="card">
    <div class="row">
      <div>
        <h2>Tasks Worker</h2>
        <div class="status">
          <span class="dot" id="dot-tasks"></span>
          <span id="txt-tasks">Loading…</span>
        </div>
        <div class="meta" id="meta-tasks"></div>
      </div>
      <button id="btn-tasks">…</button>
    </div>
    <div class="err" id="err-tasks"></div>
  </div>

  <div class="card">
    <div class="row">
      <div>
        <h2>Parsing Worker</h2>
        <div class="status">
          <span class="dot" id="dot-parsing"></span>
          <span id="txt-parsing">Loading…</span>
        </div>
        <div class="meta" id="meta-parsing"></div>
      </div>
      <button id="btn-parsing">…</button>
    </div>
    <div class="err" id="err-parsing"></div>
  </div>

  <div class="card">
    <div class="row">
      <h2>Worker Logs</h2>
      <button class="clear" id="btn-clear-logs">Clear</button>
    </div>
    <div class="filters">
      <select id="f-worker">
        <option value="">All workers</option>
        <option value="tasks">Tasks</option>
        <option value="parsing">Parsing</option>
      </select>
      <select id="f-level">
        <option value="">All levels</option>
        <option value="INFO">INFO</option>
        <option value="ERROR">ERROR</option>
        <option value="WARNING">WARNING</option>
        <option value="DEBUG">DEBUG</option>
      </select>
      <input type="text" id="f-reference" placeholder="Filter by reference no…">
    </div>
    <div class="logbox" id="logbox"></div>
  </div>
</div>

<script>
const WORKERS = ["tasks", "parsing"];
let busy = {};

function fmtUptime(sec) {
  if (sec == null) return "";
  if (sec < 60) return Math.floor(sec) + "s";
  const m = Math.floor(sec / 60);
  if (m < 60) return m + "m " + Math.floor(sec % 60) + "s";
  return Math.floor(m / 60) + "h " + (m % 60) + "m";
}

function render(name, st) {
  const running = st.status === "RUNNING";
  const dot = document.getElementById("dot-" + name);
  const txt = document.getElementById("txt-" + name);
  const meta = document.getElementById("meta-" + name);
  const btn = document.getElementById("btn-" + name);
  dot.className = "dot " + (running ? "on" : "off");
  txt.textContent = running ? "Running" : "Stopped";
  let m = "command: manage.py " + st.command;
  if (running && st.pid) m += " · pid " + st.pid;
  if (running && st.uptime_sec != null) m += " · up " + fmtUptime(st.uptime_sec);
  meta.textContent = m;
  btn.textContent = running ? "Stop" : "Start";
  btn.className = running ? "stop" : "start";
  btn.disabled = !!busy[name];
}

async function toggle(name) {
  const st = document.getElementById("txt-" + name).textContent;
  const action = st === "Running" ? "stop" : "start";
  const errEl = document.getElementById("err-" + name);
  errEl.textContent = "";
  busy[name] = true;
  const btn = document.getElementById("btn-" + name);
  btn.disabled = true;
  try {
    const resp = await fetch("/api/dashboard/worker/" + name + "/" + action + "/", { method: "POST" });
    const data = await resp.json();
    if (!resp.ok || data.error) {
      errEl.textContent = data.error || ("HTTP " + resp.status);
      busy[name] = false;
      return;
    }
    render(name, data);
  } catch (e) {
    errEl.textContent = "Request failed: " + e;
  } finally {
    busy[name] = false;
    const b = document.getElementById("btn-" + name);
    if (!b.disabled) b.disabled = false;
  }
}

async function refresh() {
  try {
    const resp = await fetch("/api/dashboard/status/");
    const data = await resp.json();
    for (const name of WORKERS) {
      if (data[name]) render(name, data[name]);
    }
  } catch (e) {
    console.error("status refresh failed", e);
  }
}

const logbox = document.getElementById("logbox");
const MAX_ROWS = 500;
let lastSeq = 0;
let appended = 0;

function fmtTime(ts) {
  const d = new Date(ts * 1000);
  const p = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) +
    " " + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
}

function appendRows(rows) {
  for (const r of rows) {
    const div = document.createElement("div");
    div.className = "lrow";
    const ts = document.createElement("span");
    ts.className = "ts";
    ts.textContent = fmtTime(r.ts);
    const lv = document.createElement("span");
    lv.className = "lv " + r.level;
    lv.textContent = r.level;
    const w = document.createElement("span");
    w.className = "w";
    w.textContent = "[" + r.worker + "]";
    const msg = document.createElement("span");
    msg.textContent = r.message;
    div.appendChild(ts);
    div.appendChild(lv);
    div.appendChild(w);
    div.appendChild(msg);
    logbox.appendChild(div);
  }
  appended += rows.length;
  while (logbox.childNodes.length > MAX_ROWS) {
    logbox.removeChild(logbox.firstChild);
  }
  logbox.scrollTop = logbox.scrollHeight;
}

async function fetchLogs() {
  const worker = document.getElementById("f-worker").value;
  const level = document.getElementById("f-level").value;
  const reference = document.getElementById("f-reference").value.trim();
  const params = new URLSearchParams();
  if (worker) params.set("worker", worker);
  if (level) params.set("level", level);
  if (reference) params.set("reference", reference);
  params.set("after", String(lastSeq));
  try {
    const resp = await fetch("/api/dashboard/logs/?" + params.toString());
    const data = await resp.json();
    if (data.logs && data.logs.length) {
      appendRows(data.logs);
      lastSeq = data.logs[data.logs.length - 1].seq;
    }
  } catch (e) {
    console.error("log fetch failed", e);
  }
}

async function clearLogs() {
  try {
    await fetch("/api/dashboard/logs/clear/", { method: "POST" });
  } catch (e) { /* ignore */ }
  logbox.textContent = "";
  lastSeq = 0;
}

document.getElementById("btn-clear-logs").addEventListener("click", clearLogs);

for (const name of WORKERS) {
  document.getElementById("btn-" + name).addEventListener("click", () => toggle(name));
}

for (const id of ["f-worker", "f-level", "f-reference"]) {
  document.getElementById(id).addEventListener("change", () => {
    logbox.textContent = "";
    lastSeq = 0;
    fetchLogs();
  });
}
document.getElementById("f-reference").addEventListener("input", () => {
  logbox.textContent = "";
  lastSeq = 0;
  fetchLogs();
});

refresh();
fetchLogs();
setInterval(refresh, 2000);
setInterval(fetchLogs, 1500);
</script>
</body>
</html>
